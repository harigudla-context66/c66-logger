<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 700" role="img" aria-label="Flow diagram: at init the connection library (c66_clients, get_pg_conn, get_ch_client) returns a connection object, and the host package constructs AuditLogger with tenant_id, environment_id, target_type and that connection, or binds one logger per tenant; the sink registry builds the Postgres, ClickHouse or MongoDB sink, which checks that logs.log_entry and logs.log_run exist. Per run, run() or record_run() writes the log_run row synchronously as Running and again with its final status. On every log call, including c66-chatbot calls through Telemetry, items become one LogEntry each with ids, caller, thread and exception details, are queued in a background writer and written to log_entry in idempotent batches; rows the database rejects are dropped individually, and outages are retried.">
  <rect x="0" y="0" width="1360" height="700" fill="#ffffff"/>
  <defs>
    <marker id="arrowNeutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f8795" />
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b4610a" />
    </marker>
    <marker id="arrowRun" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6f8f" />
    </marker>
    <marker id="arrowText" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6675" />
    </marker>
  </defs>

  <!-- lane bands -->
  <rect x="0" y="0" width="1360" height="190" rx="12" fill="#eef1f5" />
  <text x="16" y="26" font-family="'Sora', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#5c6675">ONCE, AT INIT — THE CALLER SUPPLIES TENANT, ENVIRONMENT AND CONNECTION</text>

  <text x="280" y="252" font-family="'Sora', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#205469">PER RUN — SYNCHRONOUS</text>

  <rect x="0" y="480" width="1360" height="210" rx="12" fill="#fdf1e0" />
  <text x="16" y="506" font-family="'Sora', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#8a4a08">EVERY LOG CALL — THE HOST NEVER WAITS ON THE DATABASE</text>

  <!-- Host package -->
  <rect x="20" y="300" width="190" height="70" rx="10" fill="#ffffff" stroke="#5c6675" stroke-width="1.6"/>
  <text x="115" y="330" text-anchor="middle" font-family="'Sora', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650" fill="#1a1f27">Host package</text>
  <text x="115" y="349" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5c6675">c66-chatbot (Telemetry)</text>

  <!-- ===== INIT LANE ===== -->
  <!-- Connection library -->
  <rect x="20" y="46" width="190" height="84" rx="10" fill="#ffffff" stroke="#5c6675" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="115" y="72" text-anchor="middle" font-family="'Sora', ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="650" fill="#1a1f27">Connection library</text>
  <text x="115" y="91" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5c6675">c66_clients</text>
  <text x="115" y="105" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5c6675">get_pg_conn()</text>
  <text x="115" y="119" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5c6675">get_ch_client()</text>
  <line x1="210" y1="88" x2="278" y2="88" stroke="#7f8795" stroke-width="1.5" marker-end="url(#arrowNeutral)"/>
  <text x="216" y="80" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#7f8795">conn obj</text>

  <rect x="280" y="46" width="250" height="84" rx="10" fill="#ffffff" stroke="#b7bfc9" stroke-width="1.5"/>
  <text x="405" y="72" text-anchor="middle" font-family="'Sora', ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="650" fill="#1a1f27">AuditLogger(...)</text>
  <text x="405" y="91" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5c6675">tenant_id, environment_id · bind()</text>
  <text x="405" y="105" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5c6675">"postgres" | "clickhouse"</text>
  <text x="405" y="119" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5c6675">connection=&lt;object&gt; (not closed)</text>

  <rect x="610" y="52" width="210" height="74" rx="10" fill="#ffffff" stroke="#b7bfc9" stroke-width="1.5"/>
  <text x="715" y="81" text-anchor="middle" font-family="'Sora', ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="650" fill="#1a1f27">Sink registry</text>
  <text x="715" y="100" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5c6675">postgres · clickhouse · mongodb</text>
  <text x="715" y="114" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5c6675">memory · + register_sink(...)</text>

  <rect x="280" y="144" width="420" height="32" rx="8" fill="#ffffff" stroke="#d7dce3" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="294" y="164" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5c6675">credentials only via the caller's connection · tables pre-exist</text>

  <line x1="190" y1="300" x2="278" y2="118" stroke="#7f8795" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowNeutral)"/>
  <text x="120" y="236" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7f8795">constructs</text>
  <text x="120" y="250" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7f8795">once</text>

  <line x1="530" y1="89" x2="608" y2="89" stroke="#7f8795" stroke-width="1.4" marker-end="url(#arrowNeutral)"/>
  <text x="534" y="80" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7f8795">create_sink()</text>

  <line x1="820" y1="112" x2="878" y2="244" stroke="#7f8795" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowNeutral)"/>
  <text x="708" y="150" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#7f8795">builds sink, open():</text>
  <text x="708" y="164" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#7f8795">connect + check both</text>
  <text x="708" y="178" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#7f8795">tables exist</text>

  <!-- ===== RUN PATH ===== -->
  <rect x="280" y="262" width="250" height="84" rx="10" fill="#ffffff" stroke="#2f6f8f" stroke-width="1.6"/>
  <text x="405" y="288" text-anchor="middle" font-family="'Sora', ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="650" fill="#1a1f27">run() · record_run()</text>
  <text x="405" y="307" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5c6675">start: status=Running</text>
  <text x="405" y="321" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5c6675">end: Completed · Failed · Cancelled</text>
  <text x="405" y="335" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5c6675">sets run_id for entries in the block</text>

  <line x1="210" y1="325" x2="278" y2="310" stroke="#2f6f8f" stroke-width="2" marker-end="url(#arrowRun)"/>

  <line x1="530" y1="304" x2="884" y2="290" stroke="#2f6f8f" stroke-width="2" marker-end="url(#arrowRun)"/>
  <text x="560" y="286" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#205469">write_run(): upsert on run_id</text>
  <text x="560" y="322" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#205469">at start (before any entry can reference it)</text>
  <text x="560" y="336" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#205469">and at end (after flushing the run's entries)</text>

  <!-- ===== SINKS (shared) ===== -->
  <rect x="884" y="226" width="226" height="236" rx="12" fill="none" stroke="#b7bfc9" stroke-width="1.2"/>
  <text x="898" y="246" font-family="'Sora', ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.06em" fill="#5c6675">SINK · PICKED BY target_type</text>

  <rect x="898" y="258" width="198" height="42" rx="9" fill="#ffffff" stroke="#b7bfc9" stroke-width="1.5"/>
  <text x="997" y="276" text-anchor="middle" font-family="'Sora', ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#1a1f27">PostgresSink</text>
  <text x="997" y="291" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5c6675">DB-API · conn, pool or factory</text>
  <rect x="898" y="306" width="198" height="42" rx="9" fill="#ffffff" stroke="#b7bfc9" stroke-width="1.5"/>
  <text x="997" y="324" text-anchor="middle" font-family="'Sora', ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#1a1f27">ClickHouseSink</text>
  <text x="997" y="339" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5c6675">clickhouse_connect / _driver</text>
  <rect x="898" y="354" width="198" height="42" rx="9" fill="#ffffff" stroke="#b7bfc9" stroke-width="1.5"/>
  <text x="997" y="372" text-anchor="middle" font-family="'Sora', ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#1a1f27">MongoSink</text>
  <text x="997" y="387" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5c6675">pymongo · 1 client</text>
  <rect x="898" y="402" width="198" height="42" rx="9" fill="none" stroke="#7f8795" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="997" y="420" text-anchor="middle" font-family="'Sora', ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#5c6675">S3 / Kafka sink</text>
  <text x="997" y="435" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5c6675">planned · register_sink()</text>

  <!-- ===== TARGETS ===== -->
  <rect x="1168" y="258" width="180" height="42" rx="9" fill="#edf0f4" stroke="#b7bfc9" stroke-width="1.5"/>
  <rect x="1168" y="258" width="5" height="42" fill="#b4610a" opacity="0.5"/>
  <text x="1260" y="276" text-anchor="middle" font-family="'Sora', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#1a1f27">log_run · log_entry</text>
  <text x="1260" y="291" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5c6675">Postgres · FKs to app.*</text>
  <rect x="1168" y="306" width="180" height="42" rx="9" fill="#edf0f4" stroke="#b7bfc9" stroke-width="1.5"/>
  <rect x="1168" y="306" width="5" height="42" fill="#b4610a" opacity="0.5"/>
  <text x="1260" y="324" text-anchor="middle" font-family="'Sora', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#1a1f27">log_run · log_entry</text>
  <text x="1260" y="339" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5c6675">ClickHouse · ReplacingMT</text>
  <rect x="1168" y="354" width="180" height="42" rx="9" fill="#edf0f4" stroke="#b7bfc9" stroke-width="1.5"/>
  <rect x="1168" y="354" width="5" height="42" fill="#b4610a" opacity="0.5"/>
  <text x="1260" y="372" text-anchor="middle" font-family="'Sora', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#1a1f27">log_run · log_entry</text>
  <text x="1260" y="387" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5c6675">MongoDB · same fields</text>
  <rect x="1168" y="402" width="180" height="42" rx="9" fill="none" stroke="#7f8795" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="1258" y="420" text-anchor="middle" font-family="'Sora', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#5c6675">bucket / topics</text>
  <text x="1258" y="435" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5c6675">to_json() lines</text>

  <text x="1112" y="271" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5c6675">writes</text>
  <line x1="1098" y1="279" x2="1166" y2="279" stroke="#5c6675" stroke-width="1.5" marker-end="url(#arrowText)"/>
  <line x1="1098" y1="327" x2="1166" y2="327" stroke="#5c6675" stroke-width="1.5" marker-end="url(#arrowText)"/>
  <line x1="1098" y1="375" x2="1166" y2="375" stroke="#5c6675" stroke-width="1.5" marker-end="url(#arrowText)"/>
  <line x1="1098" y1="423" x2="1166" y2="423" stroke="#7f8795" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrowNeutral)"/>

  <!-- ===== HOT LANE ===== -->
  <rect x="280" y="528" width="250" height="84" rx="10" fill="#ffffff" stroke="#b4610a" stroke-width="1.6"/>
  <text x="405" y="553" text-anchor="middle" font-family="'Sora', ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="650" fill="#1a1f27">1 LogEntry per item</text>
  <text x="405" y="572" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5c6675">dict · list · JSON · CSV · text</text>
  <text x="405" y="586" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5c6675">+ ids, caller, thread, exception</text>
  <text x="405" y="600" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5c6675">bad input raises here</text>

  <rect x="610" y="534" width="220" height="72" rx="10" fill="#ffffff" stroke="#b4610a" stroke-width="1.6"/>
  <text x="720" y="562" text-anchor="middle" font-family="'Sora', ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="650" fill="#1a1f27">BufferedWriter</text>
  <text x="720" y="580" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5c6675">queue + 1 background thread</text>
  <text x="720" y="594" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5c6675">(mode="sync": no thread)</text>

  <rect x="610" y="624" width="400" height="50" rx="8" fill="#ffffff" stroke="#d7dce3" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="624" y="644" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5c6675">FK / CHECK violation: only that row dropped (on_drop)</text>
  <text x="624" y="659" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5c6675">outage: batch retried 3x with backoff, then on_drop</text>
  <line x1="720" y1="606" x2="720" y2="622" stroke="#b7bfc9" stroke-width="1.3" marker-end="url(#arrowNeutral)"/>

  <line x1="190" y1="370" x2="278" y2="560" stroke="#b4610a" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <text x="84" y="430" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#8a4a08">audit.info(...)</text>
  <text x="84" y="444" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#8a4a08">Telemetry.log_*()</text>
  <text x="84" y="458" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#8a4a08">AuditLogHandler</text>

  <line x1="530" y1="570" x2="608" y2="570" stroke="#b4610a" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <text x="536" y="562" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#8a4a08">submit()</text>

  <line x1="830" y1="548" x2="896" y2="466" stroke="#b4610a" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <text x="872" y="522" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8a4a08">write_batch(): 500 rows · 2 s · flush()</text>
  <text x="872" y="536" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8a4a08">idempotent: ON CONFLICT · dedup token</text>
</svg>
