# Local Kafka + ClickHouse for EventLogger: the full path, service -> Kafka -> ClickHouse.
#
#   docker compose -f deploy/docker-compose.events.yml up -d
#   python examples/21_events_pipeline.py --kafka localhost:29092
#   docker compose -f deploy/docker-compose.events.yml exec clickhouse \
#     clickhouse-client -u c66 --password c66 -q "SELECT EventName, Criticality FROM logs.events"
#
# Development only: one broker, no TLS, fixed passwords.
name: c66-events

services:
  kafka:
    image: apache/kafka:3.9.0
    ports: ["29092:29092"]          # from the host: localhost:29092; inside compose: kafka:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      retries: 20

  kafka-init:                       # creates the topics, then exits
    image: apache/kafka:3.9.0
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      BOOTSTRAP: kafka:9092
    volumes: ["./kafka-topics.sh:/kafka-topics.sh:ro"]
    entrypoint: ["/bin/sh", "/kafka-topics.sh"]

  clickhouse:                       # applies docs/sql/clickhouse_events_schema.sql on first start
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123"]
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment:
      CLICKHOUSE_USER: c66
      CLICKHOUSE_PASSWORD: c66
    volumes:
      - ../docs/sql/clickhouse_events_schema.sql:/docker-entrypoint-initdb.d/01_events.sql:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}
